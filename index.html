<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayHub - TV Ao Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#07090e',
                        cardbg: '#0f172a',
                        cardhover: '#1e293b',
                        accent: '#6366f1',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.95); }
        }
        .animate-pulse-fast {
            animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #07090e;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        img {
            -webkit-user-drag: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-nav {
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <header class="sticky top-0 z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3.5 cursor-pointer group" onclick="resetFilters()">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-pink-600 flex items-center justify-center shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition-transform duration-300">
                    <i class="fa-solid fa-tv text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                        Play<span class="text-indigo-500">Hub</span>
                    </h1>
                    <span class="text-[10px] uppercase tracking-widest text-indigo-400 font-bold">Streaming Ao Vivo</span>
                </div>
            </div>

            <div class="flex-1 max-w-xl mx-4 hidden md:block">
                <div class="relative group">
                    <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm group-focus-within:text-indigo-400 transition-colors"></i>
                    <input type="text" id="searchInput" oninput="filterChannels(event)" placeholder="Pesquisar canais, filmes, esportes..." 
                        class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl pl-11 pr-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all shadow-inner">
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="toggleFavoritesFilter()" id="favFilterBtn" class="flex items-center space-x-2.5 px-4 py-2.5 rounded-2xl bg-slate-900/90 border border-slate-800 hover:border-slate-700 text-sm font-semibold text-slate-300 transition-all shadow-sm hover:shadow">
                    <i class="fa-regular fa-heart text-rose-500 text-base" id="favIcon"></i>
                    <span class="hidden sm:inline">Favoritos</span>
                </button>
            </div>
        </div>
        <div class="p-3 bg-darkbg/90 border-t border-slate-800/40 md:hidden">
            <div class="relative">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchMobileInput" oninput="filterChannels(event)" placeholder="Pesquisar canal..." 
                    class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-11 pr-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <section id="playerSection" class="hidden space-y-5 animate-fade-in">
            <div class="glass-panel p-5 rounded-3xl flex flex-col lg:flex-row lg:items-center justify-between gap-4 border border-indigo-500/20 shadow-2xl shadow-indigo-500/5">
                <div class="flex items-center space-x-4">
                    <button onclick="closePlayer()" class="w-11 h-11 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition-all hover:scale-105" title="Voltar">
                        <i class="fa-solid fa-arrow-left text-base"></i>
                    </button>
                    <div>
                        <h2 id="playerChannelName" class="text-xl font-bold text-white flex items-center gap-2.5">Nome do Canal</h2>
                        <span class="text-xs text-indigo-400 font-semibold tracking-wide uppercase flex items-center gap-1.5 mt-0.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Transmissão HD Ao Vivo
                        </span>
                    </div>
                </div>

                <div class="flex items-center gap-2 overflow-x-auto pb-1 lg:pb-0" id="streamOptionsContainer">
                </div>
            </div>

            <div class="relative w-full bg-black rounded-3xl overflow-hidden shadow-2xl shadow-black/80 border border-slate-800 aspect-video ring-1 ring-white/10">
                <div id="iframeContainer" class="w-full h-full">
                </div>
            </div>
        </section>

        <div class="flex items-center space-x-3 overflow-x-auto pb-2 scrollbar-none" id="categoryFilters">
            <button onclick="filterByCategory('Todos')" class="cat-btn px-5 py-2.5 rounded-2xl text-sm font-semibold whitespace-nowrap transition-all bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/30 hover:scale-105" data-cat="Todos">
                <i class="fa-solid fa-border-all mr-2"></i> Todos os Canais
            </button>
            <button onclick="filterByCategory('Infantil')" class="cat-btn px-5 py-2.5 rounded-2xl text-sm font-semibold whitespace-nowrap transition-all bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700 hover:bg-slate-800" data-cat="Infantil">
                <i class="fa-solid fa-child mr-2"></i> Infantil
            </button>
            <button onclick="filterByCategory('Variedades')" class="cat-btn px-5 py-2.5 rounded-2xl text-sm font-semibold whitespace-nowrap transition-all bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700 hover:bg-slate-800" data-cat="Variedades">
                <i class="fa-solid fa-film mr-2"></i> Variedades & Filmes
            </button>
            <button onclick="filterByCategory('Esportes')" class="cat-btn px-5 py-2.5 rounded-2xl text-sm font-semibold whitespace-nowrap transition-all bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700 hover:bg-slate-800" data-cat="Esportes">
                <i class="fa-solid fa-futbol mr-2"></i> Esportes
            </button>
	    <button onclick="filterByCategory('Canais Abertos')" class="cat-btn px-5 py-2.5 rounded-2xl text-sm font-semibold whitespace-nowrap transition-all bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700 hover:bg-slate-800" data-cat="Canais Abertos">
                <i class="fa-solid fa-tv"></i></i> Canais Abertos
            </button>
        </div>

        <section class="space-y-5">
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
                <h3 id="sectionTitle" class="text-xl font-extrabold text-white flex items-center gap-3 tracking-tight">
                    <div class="w-8 h-8 rounded-xl bg-indigo-500/10 flex items-center justify-center text-indigo-400 border border-indigo-500/20">
                        <i class="fa-solid fa-fire text-sm"></i>
                    </div>
                    Canais Disponíveis
                </h3>
                <span id="channelCount" class="text-xs font-bold text-indigo-300 bg-indigo-950/60 border border-indigo-500/30 px-3.5 py-1.5 rounded-full shadow-sm">0 canais</span>
            </div>

            <div id="channelsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            </div>

            <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center space-y-4">
                <div class="w-20 h-20 rounded-3xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-600 text-3xl shadow-inner">
                    <i class="fa-solid fa-satellite-dish animate-pulse"></i>
                </div>
                <div class="space-y-1">
                    <p class="text-slate-200 font-bold text-base">Nenhum canal encontrado</p>
                    <p class="text-xs text-slate-500">Tente buscar por outro termo ou categoria.</p>
                </div>
                <button onclick="resetFilters()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition-all shadow-md shadow-indigo-600/20">Limpar filtros</button>
            </div>
        </section>

    </main>

    <footer class="mt-auto border-t border-slate-800/80 bg-darkbg py-8 text-center text-xs text-slate-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="font-medium text-slate-400">PlayHub Core Ativo &bull; Servidores Estáveis</span>
            </div>
            <p>PlayHub &copy; 2026 — Todos os direitos reservados</p>
        </div>
    </footer>

    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });

        setInterval(function() {
            const startTime = performance.now();
            debugger;
            const endTime = performance.now();
            if (endTime - startTime > 100) {
                document.body.innerHTML = '<div style="background:#07090e;color:white;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;font-size:20px;text-align:center;">Acesso negado. Ferramentas de desenvolvedor detectadas.</div>';
            }
        }, 1000);

        if (window.self !== window.top) {
            window.top.location = window.self.location;
        }

        let channels = [
            {
                id: 1,
                name: "Discovery Kids",
                category: "Infantil",
                logo: "https://cdn.reidoscanais.st/imagens/discoverykids.png",
                urls: [
                    "https://rdcanais.net/discoverykids",
                    "https://rdcanais.net/embed/?id=discoverykids"
                ]
            },
            {
                id: 2,
                name: "Cartoon Network",
                category: "Infantil",
                logo: "https://upload.wikimedia.org/wikipedia/commons/8/80/Cartoon_Network_2010_logo.svg",
                urls: [
                    "https://rdcanais.net/cartoonnetwork"
                ]
            },
            {
                id: 3,
                name: "Discovery Channel",
                category: "Variedades",
                logo: "https://d1r94zrla0glo-cloudfront.vercel.app/sinalpublico/logo/discovery.png",
                urls: [
                    "https://rdcanais.net/discoverychannel"
                ]
            },
            {
                id: 4,
                name: "ESPN Brasil",
                category: "Esportes",
                logo: "https://upload.wikimedia.org/wikipedia/commons/9/99/ESPN_logo.png",
                urls: [
                    "https://rdcanais.net/espn",
                    "https://rdcanais.net/espnbrasil"
                ]
            },
            {
                id: 5,
                name: "Telecine Pipoca",
                category: "Variedades",
                logo: "https://upload.wikimedia.org/wikipedia/commons/3/32/Telecine_Premium_Logo_2021_%2843676%29.png",
                urls: [
                    "https://rdcanais.net/telecinepipoca"
                ]
            },
            {
                id: 6,
                name: "Premiere Clubes",
                category: "Esportes",
                logo: "https://cdn.reidoscanais.st/imagens/premiere.png",
                urls: [
                    "https://rdcanais.net/premiereclubes"
                ]
            },

		{
                id: 7,
                name: "Premiere 2",
                category: "Esportes",
                logo: "https://d1r94zrla0glo-cloudfront.vercel.app/sinalpublico/logo/premiere-2.png",
                urls: [
                    "https://sinalpublicoetv.vercel.app/?id=premiere2"
                ]
            },

		{
                id: 8,
                name: "Premiere 3",
                category: "Esportes",
                logo: "https://d1r94zrla0glo-cloudfront.vercel.app/sinalpublico/logo/premiere-3.png",
                urls: [
                    "https://sinalpublicoetv.vercel.app/?id=premiere3"
                ]
            },

		{
                id: 9,
                name: "Caze TV",
                category: "Esportes",
                logo: "https://cdn.reidoscanais.st/imagens/cazetv.webp",
                urls: [
                    "https://sinalpublicoetv.vercel.app/?id=caze1"
                ]
            },

		{
                id: 10,
                name: "Prime Video 1",
                category: "Esportes",
                logo: "https://img.faz-o-eli.online/primevideo.png",
                urls: [
                    "https://78b14b2a2e1de4a48ea54726bf50b5d2.embedtv.lat/primevideo"
                ]
            },

		{
                id: 11,
                name: "Prime Video 2",
                category: "Esportes",
                logo: "https://img.faz-o-eli.online/primevideo.png",
                urls: [
                    "https://bfd1b80851a4adeff37f6c0df7a8cb08.embedtv.lat/primevideo2"
                ]
            },

		{
                id: 12,
                name: "Globo RS",
                category: "Canais Abertos",
                logo: "https://cdn.reidoscanais.st/imagens/tvglobo.png",
                urls: [
                    "https://rdcanais.net/globors"
                ]
            }

        ];

        let favorites = JSON.parse(localStorage.getItem('playhub_favorites')) || [];
        let currentCategory = 'Todos';
        let showOnlyFavorites = false;
        let activeChannelId = null;
        let activeStreamIndex = 0;

        document.addEventListener('DOMContentLoaded', () => {
            renderChannels();
        });

        function renderChannels() {
            const grid = document.getElementById('channelsGrid');
            const emptyState = document.getElementById('emptyState');
            const searchQuery = (document.getElementById('searchInput').value || document.getElementById('searchMobileInput').value).toLowerCase();

            grid.innerHTML = '';

            let filtered = channels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(searchQuery);
                const matchesCategory = currentCategory === 'Todos' || channel.category === currentCategory;
                const matchesFav = !showOnlyFavorites || favorites.includes(channel.id);
                return matchesSearch && matchesCategory && matchesFav;
            });

            document.getElementById('channelCount').innerText = `${filtered.length} canais`;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            } else {
                emptyState.classList.remove('flex');
                emptyState.classList.add('hidden');
            }

            filtered.forEach(channel => {
                const isFav = favorites.includes(channel.id);
                const card = document.createElement('div');
                card.className = "group relative glass-panel hover:bg-cardhover/90 border border-slate-800/80 hover:border-indigo-500/50 rounded-3xl p-5 flex flex-col items-center justify-between transition-all duration-300 hover:shadow-2xl hover:shadow-indigo-500/10 hover:-translate-y-1 cursor-pointer";
                
                card.innerHTML = `
                    <button onclick="event.stopPropagation(); toggleFavorite(${channel.id})" class="absolute top-4 right-4 w-9 h-9 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-rose-500 transition-all z-10 shadow-sm">
                        <i class="fa-${isFav ? 'solid text-rose-500' : 'regular'} fa-heart text-sm"></i>
                    </button>

                    <div class="absolute top-4 left-4 flex items-center gap-1.5 bg-rose-500/10 border border-rose-500/30 px-2.5 py-1 rounded-full z-10 shadow-sm">
                        <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse-fast"></span>
                        <span class="text-[9px] font-extrabold tracking-widest text-rose-400 uppercase">AO VIVO</span>
                    </div>

                    <div class="w-full h-28 my-6 flex items-center justify-center p-3 relative group-hover:scale-105 transition-transform duration-300" onclick="playChannel(${channel.id})">
                        <div class="absolute inset-0 bg-indigo-500/5 rounded-2xl filter blur-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <img src="${channel.logo}" alt="${channel.name}" class="max-h-full max-w-full object-contain filter drop-shadow-lg relative z-10" onerror="this.src='https://via.placeholder.com/150?text=TV'">
                    </div>

                    <div class="w-full text-center space-y-1.5" onclick="playChannel(${channel.id})">
                        <h4 class="font-bold text-sm text-slate-100 truncate group-hover:text-indigo-400 transition-colors">${channel.name}</h4>
                        <span class="inline-block text-[10px] bg-slate-900/90 border border-slate-800 text-slate-400 px-3 py-1 rounded-full font-semibold tracking-wide">${channel.category}</span>
                    </div>

                    <button onclick="playChannel(${channel.id})" class="mt-5 w-full py-2.5 bg-indigo-600/15 hover:bg-indigo-600 text-indigo-400 hover:text-white rounded-2xl text-xs font-bold transition-all flex items-center justify-center gap-2 border border-indigo-500/30 hover:border-transparent shadow-sm">
                        <i class="fa-solid fa-play text-[10px]"></i> Assistir Agora
                    </button>
                `;

                grid.appendChild(card);
            });
        }

        function playChannel(id, streamIndex = 0) {
            const channel = channels.find(c => c.id === id);
            if (!channel) return;

            activeChannelId = id;
            activeStreamIndex = streamIndex;

            document.getElementById('playerChannelName').innerHTML = `<i class="fa-solid fa-tv text-indigo-400"></i> ${channel.name}`;

            const optionsContainer = document.getElementById('streamOptionsContainer');
            optionsContainer.innerHTML = '';

            if (channel.urls && channel.urls.length > 1) {
                channel.urls.forEach((url, idx) => {
                    const isSelected = idx === streamIndex;
                    const btn = document.createElement('button');
                    btn.className = `px-3.5 py-2 rounded-xl text-xs font-semibold transition-all flex items-center gap-2 border ${
                        isSelected 
                            ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white border-indigo-500 shadow-md shadow-indigo-600/30' 
                            : 'bg-slate-900/90 text-slate-400 border-slate-800 hover:text-white hover:border-slate-700'
                    }`;
                    btn.innerHTML = `<i class="fa-solid fa-server text-[10px]"></i> Opção ${idx + 1}`;
                    btn.onclick = () => playChannel(id, idx);
                    optionsContainer.appendChild(btn);
                });
            } else {
                optionsContainer.innerHTML = `<span class="text-xs font-semibold text-slate-400 bg-slate-900/90 px-3.5 py-2 rounded-xl border border-slate-800">Servidor Único</span>`;
            }

            const activeUrl = channel.urls[streamIndex] || channel.urls[0];
            const container = document.getElementById('iframeContainer');
            container.innerHTML = `<iframe src="${activeUrl}" class="w-full h-full border-0" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;

            const playerSection = document.getElementById('playerSection');
            playerSection.classList.remove('hidden');
            playerSection.scrollIntoView({ behavior: 'smooth' });
        }

        function closePlayer() {
            const playerSection = document.getElementById('playerSection');
            playerSection.classList.add('hidden');
            document.getElementById('iframeContainer').innerHTML = '';
            activeChannelId = null;
            activeStreamIndex = 0;
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('playhub_favorites', JSON.stringify(favorites));
            renderChannels();
        }

        function toggleFavoritesFilter() {
            showOnlyFavorites = !showOnlyFavorites;
            const btn = document.getElementById('favFilterBtn');
            const icon = document.getElementById('favIcon');

            if (showOnlyFavorites) {
                btn.classList.add('bg-indigo-600/20', 'border-indigo-500/50', 'text-indigo-300');
                icon.classList.remove('fa-regular');
                icon.classList.add('fa-solid', 'text-rose-500');
            } else {
                btn.classList.remove('bg-indigo-600/20', 'border-indigo-500/50', 'text-indigo-300');
                icon.classList.remove('fa-solid');
                icon.classList.add('fa-regular');
            }
            renderChannels();
        }

        function filterByCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = "cat-btn px-5 py-2.5 rounded-2xl text-sm font-semibold whitespace-nowrap transition-all bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/30 hover:scale-105";
                } else {
                    btn.className = "cat-btn px-5 py-2.5 rounded-2xl text-sm font-semibold whitespace-nowrap transition-all bg-slate-900/90 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700 hover:bg-slate-800";
                }
            });
            renderChannels();
        }

        function filterChannels(event) {
            const val = event.target.value;
            document.getElementById('searchInput').value = val;
            document.getElementById('searchMobileInput').value = val;
            renderChannels();
        }

        function resetFilters() {
            currentCategory = 'Todos';
            showOnlyFavorites = false;
            document.getElementById('searchInput').value = '';
            document.getElementById('searchMobileInput').value = '';
            filterByCategory('Todos');
        }
    </script>
</body>
</html>
