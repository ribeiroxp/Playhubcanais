<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; media-src https:; frame-src https://rdcanais.net https://*.rdcanais.net https://sinalpublicoetv.vercel.app https://*.embedtv.lat; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">
    <title>PlayHub - TV Ao Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0c10',
                        cardbg: '#12161f',
                        cardhover: '#1a202c',
                        accent: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0c10; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0c10; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        #playerSection { -webkit-user-select: none; user-select: none; }
        img { -webkit-user-drag: none; }

        .glass-nav {
            background: rgba(10, 12, 16, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <div id="devtoolsWarning" class="hidden fixed inset-0 z-[9999] bg-darkbg/95 backdrop-blur-xl flex-col items-center justify-center text-center p-8">
        <i class="fa-solid fa-shield-halved text-4xl text-blue-500 mb-4"></i>
        <p class="text-white font-bold text-lg">Ferramentas de desenvolvedor detectadas</p>
        <p class="text-slate-400 text-sm mt-1">Feche o DevTools para continuar assistindo.</p>
    </div>

    <header class="sticky top-0 z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilters()">
                <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                    <i class="fa-solid fa-play text-sm"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-white">Play<span class="text-blue-500">Hub</span></span>
            </div>

            <div class="flex-1 max-w-md mx-4 hidden md:block">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="searchInput" oninput="filterChannels(event)" placeholder="Buscar canais..."
                        class="w-full bg-slate-900/80 border border-slate-800 rounded-lg pl-9 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all">
                </div>
            </div>

            <div class="flex items-center">
                <button onclick="toggleFavoritesView()" id="favBtnHeader" class="flex items-center space-x-2 px-3.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-slate-700 transition-all">
                    <i class="fa-solid fa-heart text-red-500" id="favHeaderIcon"></i>
                    <span class="hidden sm:inline">Meus Favoritos</span>
                </button>
            </div>
        </div>
        <div class="px-4 pb-3 bg-darkbg md:hidden">
            <div class="relative">
                <i class="fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input type="text" id="searchMobileInput" oninput="filterChannels(event)" placeholder="Buscar canais..."
                    class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500">
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Player -->
        <section id="playerSection" class="hidden space-y-4">
            <div class="bg-cardbg p-4 rounded-xl flex flex-col lg:flex-row lg:items-center justify-between gap-4 border border-slate-800">
                <div class="flex items-center space-x-3">
                    <button onclick="closePlayer()" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition-all" title="Voltar">
                        <i class="fa-solid fa-arrow-left text-xs"></i>
                    </button>
                    <div>
                        <h2 id="playerChannelName" class="text-base font-bold text-white flex items-center gap-2">Nome do Canal</h2>
                        <span class="text-[11px] text-emerald-400 font-medium flex items-center gap-1.5 mt-0.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Transmissão ao vivo
                        </span>
                    </div>
                </div>

                <div class="flex items-center gap-2 overflow-x-auto" id="streamOptionsContainer"></div>
            </div>

            <div class="relative w-full bg-black rounded-xl overflow-hidden border border-slate-800 aspect-video" oncontextmenu="return false;">
                <div id="iframeContainer" class="w-full h-full relative z-10"></div>
            </div>
        </section>

        <div class="flex items-center gap-2 overflow-x-auto pb-1" id="categoryFilters">
            <button onclick="filterByCategory('Todos')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-blue-600 text-white" data-cat="Todos">
                Todos
            </button>
            <button onclick="filterByCategory('Infantil')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800" data-cat="Infantil">
                Infantil
            </button>
            <button onclick="filterByCategory('Filmes & Series')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800" data-cat="Filmes & Series">
                Filmes & Séries
            </button>
            <button onclick="filterByCategory('Esportes')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800" data-cat="Esportes">
                Esportes
            </button>
            <button onclick="filterByCategory('Canais Abertos')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800" data-cat="Canais Abertos">
                Canais Abertos
            </button>
            <button onclick="filterByCategory('Notícias')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800" data-cat="Notícias">
                Notícias
            </button>
            <button onclick="filterByCategory('Documentários')" class="cat-btn px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800" data-cat="Documentários">
                Documentários
            </button>
        </div>

        <section class="space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800/60 pb-3">
                <h3 id="sectionTitle" class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                    <span>Todos os Canais</span>
                </h3>
                <span id="channelCount" class="text-xs text-slate-500 font-medium">0 canais</span>
            </div>

            <div id="channelsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>

            <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center space-y-3">
                <div class="w-12 h-12 rounded-full bg-slate-900 flex items-center justify-center text-slate-600 text-xl" id="emptyIcon">
                    <i class="fa-solid fa-tv"></i>
                </div>
                <p id="emptyText" class="text-slate-300 font-medium text-sm">Nenhum canal encontrado</p>
                <button onclick="resetFilters()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs transition-all">Ver todos os canais</button>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-800/60 bg-darkbg py-6 text-center text-xs text-slate-600">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <span class="font-medium text-slate-500">PlayHub &bull; Transmissões Ao Vivo</span>
            <p>&copy; 2026 Todos os direitos reservados</p>
        </div>
    </footer>

    <script>
        try {
            if (window.self !== window.top) {
                window.top.location = window.self.location.href;
            }
        } catch (e) {}

        (function softDevtoolsWarning() {
            const overlay = document.getElementById('devtoolsWarning');
            if (!overlay) return;
            const THRESHOLD = 180;
            let isOpen = false;
            setInterval(() => {
                const open =
                    (window.outerWidth - window.innerWidth) > THRESHOLD ||
                    (window.outerHeight - window.innerHeight) > THRESHOLD;
                if (open !== isOpen) {
                    isOpen = open;
                    overlay.classList.toggle('hidden', !open);
                    overlay.classList.toggle('flex', open);
                    if (open && typeof closePlayer === 'function') closePlayer();
                }
            }, 1500);
        })();

        const ALLOWED_STREAM_HOSTS = [
            'rdcanais.net',
            'sinalpublicoetv.vercel.app',
            'embedtv.lat'
        ];

        function isSafeStreamUrl(url) {
            try {
                const u = new URL(url, location.href);
                if (u.protocol !== 'https:') return false;
                return ALLOWED_STREAM_HOSTS.some(h =>
                    u.hostname === h || u.hostname.endsWith('.' + h)
                );
            } catch {
                return false;
            }
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[ch]);
        }

        function safeImageUrl(url) {
            try {
                const u = new URL(url, location.href);
                return (u.protocol === 'https:') ? escapeHtml(u.href) : '';
            } catch {
                return '';
            }
        }

        const rawChannels = [
            { name: "Discovery Kids", category: "Infantil", logo: "https://cdn.reidoscanais.st/imagens/discoverykids.png", urls: ["https://rdcanais.net/discoverykids", "https://rdcanais.net/embed/?id=discoverykids"] },
            { name: "Cartoon Network", category: "Infantil", logo: "https://upload.wikimedia.org/wikipedia/commons/8/80/Cartoon_Network_2010_logo.svg", urls: ["https://rdcanais.net/cartoonnetwork"] },
            { name: "Discovery Channel", category: "Documentários", logo: "https://d1r94zrla0glo-cloudfront.vercel.app/sinalpublico/logo/discovery.png", urls: ["https://rdcanais.net/discoverychannel"] },
            { name: "ESPN Brasil", category: "Esportes", logo: "https://upload.wikimedia.org/wikipedia/commons/9/99/ESPN_logo.png", urls: ["https://rdcanais.net/espn", "https://rdcanais.net/espnbrasil"] },
            { name: "Telecine Pipoca", category: "Filmes & Series", logo: "https://cdn.reidoscanais.st/imagens/telecinepipoca.png", urls: ["https://rdcanais.net/telecinepipoca"] },
            { name: "Telecine Premium", category: "Filmes & Series", logo: "https://cdn.reidoscanais.st/imagens/telecinepremium.png", urls: ["https://rdcanais.net/telecinepremium"] },
            { name: "Megapix", category: "Filmes & Series", logo: "https://cdn.reidoscanais.st/imagens/megapix.png", urls: ["https://rdcanais.net/megapix"] },
            { name: "HBO", category: "Filmes & Series", logo: "https://d1r94zrla0glo-cloudfront.vercel.app/sinalpublico/foto/embed/hbo.png", urls: ["https://sinalpublicoetv.vercel.app/?id=hbo"] },
            { name: "Premiere Clubes", category: "Esportes", logo: "https://cdn.reidoscanais.st/imagens/premiere.png", urls: ["https://rdcanais.net/premiereclubes"] },
            { name: "Premiere 2", category: "Esportes", logo: "https://d1r94zrla0glo-cloudfront.vercel.app/sinalpublico/logo/premiere-2.png", urls: ["https://sinalpublicoetv.vercel.app/?id=premiere2"] },
            { name: "Premiere 3", category: "Esportes", logo: "https://d1r94zrla0glo-cloudfront.vercel.app/sinalpublico/logo/premiere-3.png", urls: ["https://sinalpublicoetv.vercel.app/?id=premiere3"] },
            { name: "Cazé TV", category: "Esportes", logo: "https://cdn.reidoscanais.st/imagens/cazetv.webp", urls: ["https://rdcanais.net/cazetv"] },
            { name: "Cazé TV 2", category: "Esportes", logo: "https://cdn.reidoscanais.st/imagens/cazetv.webp", urls: ["https://rdcanais.net/cazetv2"] },
            { name: "Cazé TV 3", category: "Esportes", logo: "https://cdn.reidoscanais.st/imagens/cazetv.webp", urls: ["https://rdcanais.net/cazetv3"] },
            { name: "Prime Video", category: "Esportes", logo: "https://img.faz-o-eli.online/primevideo.png", urls: ["https://78b14b2a2e1de4a48ea54726bf50b5d2.embedtv.lat/primevideo"] },
            { name: "Prime Video 2", category: "Esportes", logo: "https://img.faz-o-eli.online/primevideo.png", urls: ["https://bfd1b80851a4adeff37f6c0df7a8cb08.embedtv.lat/primevideo2"] },
            { name: "Globo RS", category: "Canais Abertos", logo: "https://cdn.reidoscanais.st/imagens/tvglobo.png", urls: ["https://rdcanais.net/globors"] },
            { name: "Globo RJ", category: "Canais Abertos", logo: "https://cdn.reidoscanais.st/imagens/tvglobo.png", urls: ["https://rdcanais.net/globorj"] },
            { name: "Globo SP", category: "Canais Abertos", logo: "https://cdn.reidoscanais.st/imagens/tvglobo.png", urls: ["https://rdcanais.net/globosp"] },
            { name: "Band", category: "Canais Abertos", logo: "https://cdn.reidoscanais.st/imagens/band.png", urls: ["https://rdcanais.net/band"] },
            { name: "Record", category: "Canais Abertos", logo: "https://cdn.reidoscanais.st/imagens/record.png", urls: ["https://rdcanais.net/record"] },
            { name: "SBT", category: "Canais Abertos", logo: "https://cdn.reidoscanais.st/imagens/sbt.png", urls: ["https://rdcanais.net/sbt"] },
            { name: "CNN Brasil", category: "Notícias", logo: "https://cdn.reidoscanais.st/imagens/cnnbrasil.png", urls: ["https://rdcanais.net/cnnbrasil"] },
            { name: "JP News", category: "Notícias", logo: "https://cdn.reidoscanais.st/imagens/jpnews.webp", urls: ["https://rdcanais.net/jpnews"] }
        ];

        // Gera os IDs automaticamente
        const channels = rawChannels.map((item, index) => ({ id: index + 1, ...item }));

        let favorites = [];
        try {
            const parsed = JSON.parse(localStorage.getItem('playhub_favorites'));
            if (Array.isArray(parsed)) {
                favorites = parsed.filter(x => Number.isInteger(x));
            }
        } catch (e) {
            favorites = [];
        }

        let currentCategory = 'Todos';
        let showOnlyFavorites = false;
        let activeChannelId = null;
        let activeStreamIndex = 0;

        document.addEventListener('DOMContentLoaded', () => {
            renderChannels();
        });

        function renderChannels() {
            const grid = document.getElementById('channelsGrid');
            const emptyState = document.getElementById('emptyState');
            const sectionTitle = document.getElementById('sectionTitle');
            const emptyIcon = document.getElementById('emptyIcon');
            const emptyText = document.getElementById('emptyText');
            const searchQuery = ((document.getElementById('searchInput').value || '') + (document.getElementById('searchMobileInput').value || '')).toLowerCase();

            grid.replaceChildren();

            let filtered = channels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(searchQuery);
                if (showOnlyFavorites) {
                    return matchesSearch && favorites.includes(channel.id);
                }
                const matchesCategory = currentCategory === 'Todos' || channel.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            if (showOnlyFavorites) {
                sectionTitle.innerHTML = `<i class="fa-solid fa-heart text-red-500"></i> Meus Canais Favoritos`;
            } else if (currentCategory === 'Todos') {
                sectionTitle.innerText = `Todos os Canais`;
            } else {
                sectionTitle.innerText = `${currentCategory}`;
            }

            document.getElementById('channelCount').innerText = `${filtered.length} canais`;

            if (filtered.length === 0) {
                if (showOnlyFavorites) {
                    emptyIcon.innerHTML = `<i class="fa-solid fa-heart-crack text-red-500/50"></i>`;
                    emptyText.innerText = `Você ainda não adicionou nenhum canal aos favoritos.`;
                } else {
                    emptyIcon.innerHTML = `<i class="fa-solid fa-tv"></i>`;
                    emptyText.innerText = `Nenhum canal encontrado.`;
                }
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            } else {
                emptyState.classList.remove('flex');
                emptyState.classList.add('hidden');
            }

            filtered.forEach(channel => {
                const isFav = favorites.includes(channel.id);
                const safeId = Number(channel.id);
                const safeName = escapeHtml(channel.name);
                const safeCat = escapeHtml(channel.category);
                const safeLogo = safeImageUrl(channel.logo);

                const card = document.createElement('div');
                card.className = "group relative bg-cardbg hover:bg-cardhover border border-slate-800/80 hover:border-slate-700 rounded-xl p-4 flex flex-col items-center justify-between transition-all duration-200 cursor-pointer";
                card.onclick = () => playChannel(safeId);

                card.innerHTML = `
                    <button onclick="event.stopPropagation(); toggleFavorite(${safeId})" class="absolute top-3 right-3 w-7 h-7 rounded-lg bg-slate-900/60 hover:bg-slate-800 border border-slate-800/60 flex items-center justify-center text-slate-400 hover:text-red-500 transition-all z-10" title="${isFav ? 'Remover dos favoritos' : 'Adicionar aos favoritos'}">
                        <i class="fa-${isFav ? 'solid text-red-500' : 'regular'} fa-heart text-xs"></i>
                    </button>

                    <div class="absolute top-3 left-3 flex items-center gap-1 bg-red-500/10 border border-red-500/20 px-2 py-0.5 rounded-md z-10">
                        <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                        <span class="text-[9px] font-bold tracking-wider text-red-400 uppercase">AO VIVO</span>
                    </div>

                    <div class="w-full h-24 my-3 flex items-center justify-center p-2 relative">
                        <img src="${safeLogo}" alt="${safeName}" referrerpolicy="no-referrer" loading="lazy" class="max-h-full max-w-full object-contain filter drop-shadow group-hover:scale-105 transition-transform duration-200" onerror="this.src='https://via.placeholder.com/150?text=TV'">
                    </div>

                    <div class="w-full text-center space-y-1">
                        <h4 class="font-semibold text-xs text-slate-200 truncate group-hover:text-blue-400 transition-colors">${safeName}</h4>
                        <span class="inline-block text-[10px] text-slate-500 font-medium">${safeCat}</span>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function playChannel(id, streamIndex = 0) {
            const channel = channels.find(c => c.id === id);
            if (!channel) return;

            activeChannelId = id;
            activeStreamIndex = streamIndex;

            const nameEl = document.getElementById('playerChannelName');
            nameEl.replaceChildren();
            const icon = document.createElement('i');
            icon.className = 'fa-solid fa-tv text-blue-500';
            nameEl.append(icon, ' ' + channel.name);

            const optionsContainer = document.getElementById('streamOptionsContainer');
            optionsContainer.replaceChildren();

            if (channel.urls && channel.urls.length > 1) {
                channel.urls.forEach((_, idx) => {
                    const isSelected = idx === streamIndex;
                    const btn = document.createElement('button');
                    btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 ${
                        isSelected
                            ? 'bg-blue-600 text-white shadow-sm'
                            : 'bg-slate-900 text-slate-400 border border-slate-800 hover:text-white hover:bg-slate-800'
                    }`;
                    btn.innerHTML = `<i class="fa-solid fa-server text-[10px]"></i> Opção ${idx + 1}`;
                    btn.onclick = () => playChannel(id, idx);
                    optionsContainer.appendChild(btn);
                });
            } else {
                const span = document.createElement('span');
                span.className = 'text-xs font-medium text-slate-400 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800';
                span.textContent = 'Servidor Único';
                optionsContainer.appendChild(span);
            }

            const activeUrl = channel.urls[streamIndex] || channel.urls[0];
            const container = document.getElementById('iframeContainer');

            if (!isSafeStreamUrl(activeUrl)) {
                const err = document.createElement('div');
                err.className = 'w-full h-full flex items-center justify-center text-slate-400 text-xs';
                err.textContent = 'Servidor indisponível ou não autorizado.';
                container.replaceChildren(err);
                const playerSection = document.getElementById('playerSection');
                playerSection.classList.remove('hidden');
                playerSection.scrollIntoView({ behavior: 'smooth' });
                return;
            }

            const iframe = document.createElement('iframe');
            iframe.src = activeUrl;
            iframe.className = 'w-full h-full border-0';
            iframe.setAttribute('allowfullscreen', '');
            iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
            iframe.setAttribute('referrerpolicy', 'no-referrer');
            iframe.setAttribute('loading', 'lazy');

            container.replaceChildren(iframe);

            const playerSection = document.getElementById('playerSection');
            playerSection.classList.remove('hidden');
            playerSection.scrollIntoView({ behavior: 'smooth' });
        }

        function closePlayer() {
            const playerSection = document.getElementById('playerSection');
            playerSection.classList.add('hidden');
            document.getElementById('iframeContainer').replaceChildren();
            activeChannelId = null;
            activeStreamIndex = 0;
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('playhub_favorites', JSON.stringify(favorites));
            renderChannels();
        }

        function toggleFavoritesView() {
            showOnlyFavorites = !showOnlyFavorites;
            const btn = document.getElementById('favBtnHeader');

            if (showOnlyFavorites) {
                btn.className = "flex items-center space-x-2 px-3.5 py-1.5 rounded-lg bg-red-500/20 border border-red-500/40 text-xs font-semibold text-red-400 transition-all";
                document.querySelectorAll('.cat-btn').forEach(b => {
                    b.className = "cat-btn px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800";
                });
            } else {
                btn.className = "flex items-center space-x-2 px-3.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-slate-700 transition-all";
                filterByCategory(currentCategory);
                return;
            }
            renderChannels();
        }

        function filterByCategory(cat) {
            showOnlyFavorites = false;
            currentCategory = cat;

            const favBtn = document.getElementById('favBtnHeader');
            favBtn.className = "flex items-center space-x-2 px-3.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:border-slate-700 transition-all";

            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = "cat-btn px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-blue-600 text-white";
                } else {
                    btn.className = "cat-btn px-4 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition-all bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800";
                }
            });
            renderChannels();
        }

        function filterChannels(event) {
            const val = event.target.value;
            document.getElementById('searchInput').value = val;
            document.getElementById('searchMobileInput').value = val;
            renderChannels();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchMobileInput').value = '';
            filterByCategory('Todos');
        }
    </script>
</body>
</html>
